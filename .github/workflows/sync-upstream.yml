name: Sync Upstream

on:
  schedule:
    # 每天 UTC 04:37 运行（新加坡 12:37，日本 13:37）
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync Miao-Yunzai and independent genshin plugin
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/yoimiya-kokomi/Miao-Yunzai.git
          GENSIN_URL: https://github.com/kissnavel/genshin.git
          TARGET_BRANCH: master
        run: |
          set -Eeuo pipefail

          MARKER=".genshin-upstream-commit"
          STATE_DIR="$RUNNER_TEMP/sync-state"
          mkdir -p "$STATE_DIR"

          echo "==> Save the previous plugin marker"
          OLD_COMMIT=""
          if git cat-file -e "HEAD:$MARKER" 2>/dev/null; then
            OLD_COMMIT="$(git show "HEAD:$MARKER" | tr -d '[:space:]')"
          fi

          # Treat an invalid/missing marker as unknown so the plugin will be refreshed.
          if [[ ! "$OLD_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            OLD_COMMIT=""
          fi

          echo "==> Back up the current independent plugin and workflow files"
          if [ -d plugins/genshin ]; then
            cp -a plugins/genshin "$STATE_DIR/genshin-old"
          fi

          if [ -d .github/workflows ]; then
            cp -a .github/workflows "$STATE_DIR/workflows"
          fi

          echo "==> Fetch the Miao-Yunzai upstream"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --prune
          UPSTREAM_HEAD="$(git rev-parse "refs/remotes/upstream/$TARGET_BRANCH")"

          echo "==> Reset tracked files to the Miao-Yunzai upstream"
          git reset --hard "$UPSTREAM_HEAD"

          # Deliberately do not run git clean -fdx here: it can delete unrelated
          # untracked/ignored files. The independent plugin is removed explicitly below.
          echo "==> Restore workflow files"
          mkdir -p .github/workflows
          if [ -d "$STATE_DIR/workflows" ]; then
            cp -a "$STATE_DIR/workflows/." .github/workflows/
          fi

          echo "==> Replace the upstream genshin directory with the independent plugin"
          mkdir -p plugins
          rm -rf plugins/genshin
          if [ -d "$STATE_DIR/genshin-old" ]; then
            cp -a "$STATE_DIR/genshin-old" plugins/genshin
          fi

          echo "==> Check the independent plugin's latest default-branch commit"
          GENSIN_HEAD="$(git ls-remote "$GENSIN_URL" HEAD | awk 'NR==1 {print $1}')"
          if [ -z "$GENSIN_HEAD" ]; then
            echo "::error::Could not obtain the HEAD commit from $GENSIN_URL"
            exit 1
          fi

          if [ "$GENSIN_HEAD" != "$OLD_COMMIT" ] || [ ! -d plugins/genshin ]; then
            echo "Plugin upstream changed, marker is missing, or plugin directory is absent; cloning latest version."
            rm -rf "$STATE_DIR/genshin-new"
            git clone --depth 1 "$GENSIN_URL" "$STATE_DIR/genshin-new"
            NEW_COMMIT="$(git -C "$STATE_DIR/genshin-new" rev-parse HEAD)"

            rm -rf plugins/genshin
            mv "$STATE_DIR/genshin-new" plugins/genshin
            rm -rf plugins/genshin/.git
            printf '%s\n' "$NEW_COMMIT" > "$MARKER"
            echo "Independent plugin set to commit $NEW_COMMIT"
          else
            echo "Plugin upstream has not changed; keeping the existing plugin directory."
            printf '%s\n' "$OLD_COMMIT" > "$MARKER"
          fi

          echo "==> Commit changes, if any"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Miao-Yunzai upstream and genshin plugin"
          else
            echo "No file changes to commit."
          fi

          echo "==> Push the synchronized result to origin/$TARGET_BRANCH"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk 'NR==1 {print $1}')"

          if [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]; then
            # This intentionally replaces the fork branch history with the sync result.
            git push --force origin "HEAD:refs/heads/$TARGET_BRANCH"
          else
            echo "Remote branch already matches the local commit."
          fi
